[project]
name = "ncaa-shot-selection"
version = "0.1.0"
description = "NCAA Division I men's basketball shot-selection analysis"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "plotly>=5.20",
  "streamlit>=1.35",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
