name: CourtSense quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: python scripts/verify_snapshot.py
      - run: python scripts/smoke_app.py
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v7
        with:
          name: validated-dashboard-snapshot
          path: data/app/
          retention-days: 7
          if-no-files-found: error
